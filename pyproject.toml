# Project metadata, dependencies and test configuration. The code runs from a
# checkout (each script is invoked by path, see the README); it is not
# installed as a Python package.

[project]
name = "fire-paper"
version = "1.0.0"
description = "FiRE: auditable clinical scoring from consultation notes with a neurosymbolic concept bottleneck (code, prompts and evaluation scripts for the paper)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Shlok Shelat" },
  { name = "Shrey Salvi" },
  { name = "Souvik Roy" },
  { name = "Manas Gaur" },
  { name = "Gunjan Trivedi" },
  { name = "Riri Trivedi" },
  { name = "Amit Sheth" },
]
dependencies = [
  "aiohttp>=3.8",
  "numpy>=1.24",
  "sentence-transformers>=2.2",
  "spacy>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/ShlokShelat/fire-paper"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
